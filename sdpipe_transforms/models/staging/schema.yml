version: 2

models:
  - name: stg_collisions_basic
    description: 'Standardized collision records from SDPD'
    columns:
      - name: report_id
        description: 'Unique identifier for each collision report'
        tests:
          - unique
          - not_null
      - name: report_datetime
        description: 'Date and time when the collision was reported'
        tests:
          - not_null
  - name: stg_collisions_details
    description: 'Standardized collision participant records from SDPD'
    columns:
      - name: report_id
        description: 'Collision report identifier for the participant row'
        tests:
          - not_null
      - name: report_datetime
        description: 'Date and time when the collision was reported'
        tests:
          - not_null
      - name: source_row_num
        description: 'CSV line number for the participant row, starting at 2 for the first data row'
        tests:
          - not_null
  - name: stg_collisions_beats
    description: 'Standardized SDPD police beat reference data'
    columns:
      - name: beat
        description: 'Police beat identifier'
        tests:
          - not_null
      - name: division
        description: 'Police division the beat belongs to'
        tests:
          - not_null
      - name: service_area
        description: 'Service area the beat belongs to'
        tests:
          - not_null
  - name: stg_nws_observations
    description: 'Standardized NWS weather observations from NOAA'
    columns:
      - name: station_id
        description: 'NOAA station identifier (e.g. KSAN)'
        tests:
          - not_null
      - name: observation_timestamp
        description: 'UTC timestamp of the weather observation'
        tests:
          - not_null
      - name: observation_date
        description: 'Date extracted from observation_timestamp (UTC)'
        tests:
          - not_null
      - name: observation_timestamp_local
        description: 'Observation timestamp converted to San Diego local time (America/Los_Angeles)'
        tests:
          - not_null
      - name: observation_date_local
        description: 'Date in San Diego local time, derived from observation_timestamp_local'
        tests:
          - not_null
      - name: observation_hour_local
        description: 'Hour (0-23) in San Diego local time'
        tests:
          - not_null
      - name: latitude
        description: 'Station latitude (WGS84)'
        tests:
          - not_null
      - name: longitude
        description: 'Station longitude (WGS84)'
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - station_id
            - observation_timestamp
