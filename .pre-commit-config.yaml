repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff (lint)
        entry: venv/bin/ruff check
        language: system
        types: [python]
        args: [--fix]

      - id: ruff-format
        name: Ruff (format)
        entry: venv/bin/ruff format
        language: system
        types: [python]

      - id: sqlfluff-lint
        name: SQLFluff (lint)
        entry: venv/bin/sqlfluff lint
        language: system
        types: [sql]
        args: [--dialect, postgres]
