name: CI — Lint

on:
  push:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          sdpipe_transforms:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: dummy
                password: dummy
                dbname: dummy
                schema: raw
          EOF

      - name: Install dbt packages
        run: make dbt-deps

      - name: Run linters
        run: make lint
